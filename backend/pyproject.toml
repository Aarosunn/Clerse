[project]
name = "backend"
version = "0.1.0"
description = "Clerse FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.135.2",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.42.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.15.0",
    "pydantic-settings>=2.0.0",
    "anthropic>=0.52.0",
    "youtube-transcript-api>=0.6.0",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
